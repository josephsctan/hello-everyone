<style>
/* Layout: a left panel with the language menu, and the selected language's greetings on the right. */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --fg: #121A24;
  --muted: #566372;
  --line: #D8DFE6;
  --soft: #E3E8EE;
  --badge: #D62839;
  --badge-fg: #FFFFFF;
  --good: #1B7F55;
  --good-bg: #DDF1E7;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-script: "Noto Sans", "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "PingFang SC", "Malgun Gothic", "Noto Sans Tamil", "Noto Sans Devanagari", "Noto Sans Malayalam", "Noto Sans Thai", "Noto Sans Hebrew", "Noto Sans Bengali", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151C;
    --surface: #18212B;
    --fg: #E8EDF2;
    --muted: #93A1B0;
    --line: #2B3846;
    --soft: #223040;
    --badge: #E5455A;
    --badge-fg: #FFFFFF;
    --good: #4CC38A;
    --good-bg: #17382A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151C;
  --surface: #18212B;
  --fg: #E8EDF2;
  --muted: #93A1B0;
  --line: #2B3846;
  --soft: #223040;
  --badge: #E5455A;
  --badge-fg: #FFFFFF;
  --good: #4CC38A;
  --good-bg: #17382A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.45;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--badge); outline-offset: 2px; border-radius: 6px; }

.layout {
  max-width: 62rem;
  margin-inline: auto;
  padding: 1.25rem 1rem 3rem;
  display: grid;
  grid-template-columns: 15.5rem minmax(0, 1fr);
  gap: 1.25rem;
  align-items: start;
}

/* Left panel */
.side {
  position: sticky;
  top: 1rem;
  max-height: calc(100vh - 2rem);
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.badge h1 { margin: 0; display: flex; flex-direction: column; }
.badge .hello {
  position: relative;
  background: var(--badge);
  color: var(--badge-fg);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  text-align: center;
  padding: 1rem 1rem 0.45rem;
}
.badge .hello::before {
  content: "";
  position: absolute;
  top: 0.35rem;
  left: 50%;
  width: 2.4rem;
  height: 0.35rem;
  margin-left: -1.2rem;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.28);
}
.badge .who {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.1rem;
  line-height: 1.05;
  letter-spacing: -0.02em;
  padding: 0.7rem 1rem 0;
}
.menu { list-style: none; margin: 0; padding: 0 0.5rem; overflow-y: auto; flex: 1; scrollbar-width: thin; }
.menu button {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  text-align: left;
  border: 0;
  background: transparent;
  border-radius: 9px;
  padding: 0.6rem 0.7rem;
  min-height: 2.75rem;
  cursor: pointer;
  font-weight: 500;
}
.menu button:hover { background: var(--soft); }
.menu button[aria-current="true"] { background: var(--badge); color: var(--badge-fg); }
.menu .nm { flex: 1; min-width: 0; }
.menu .ct { font-size: 0.78rem; opacity: 0.75; font-variant-numeric: tabular-nums; }
.menu .done .ct { color: var(--good); opacity: 1; font-weight: 600; }
.menu [aria-current="true"].done .ct { color: inherit; }
.prog { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.meter span { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.25s ease; }

/* Right panel */
.pane { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--soft);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
}
.seg button {
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 0.55rem 0.4rem;
  font-weight: 600;
  font-size: 0.92rem;
  cursor: pointer;
  min-height: 2.75rem;
}
.seg button[aria-pressed="true"] { background: var(--badge); color: var(--badge-fg); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.caption { flex: 1 1 16rem; min-width: 0; margin: 0; color: var(--muted); font-size: 0.92rem; }
.pill {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 0.4rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  min-height: 2.25rem;
}

.lang { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.lang-head { padding: 1rem 1rem 0.75rem; display: flex; flex-direction: column; gap: 0.2rem; }
.lang-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.7rem; }
.lang-title h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em; }
.lang-title .own { font-family: var(--font-script); color: var(--muted); font-size: 1rem; }
.lang-title .count { margin-left: auto; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.where { margin: 0; font-size: 0.85rem; color: var(--muted); }
.tip { margin: 0.35rem 0 0; font-size: 0.88rem; background: var(--soft); border-radius: 8px; padding: 0.5rem 0.7rem; }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; padding: 0.85rem 0.6rem 0.85rem 1rem; border-top: 1px solid var(--line); align-items: start; }
.content { min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; border-radius: 8px; }
.practice .content { cursor: pointer; }
.native { font-family: var(--font-script); font-weight: 600; font-size: clamp(1.45rem, 5vw, 1.9rem); line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
.roman { font-weight: 600; font-size: 1rem; }
.say { color: var(--muted); font-size: 0.95rem; }
.say .lab { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 0.4rem; }
.mean { font-size: 0.92rem; display: flex; flex-wrap: wrap; gap: 0.3rem 0.5rem; align-items: center; }
.tag { background: var(--soft); color: var(--muted); border-radius: 99px; padding: 0.05rem 0.6rem; font-size: 0.78rem; font-weight: 500; }
.hint { display: none; font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }

.hide { filter: blur(9px); opacity: 0.5; user-select: none; pointer-events: none; }
.practice .row:not(.open) .hint { display: block; }
.mode-english .content .mean { order: -1; font-size: 1.05rem; font-weight: 600; }
.mode-english .content .mean .tag { font-weight: 500; }

.acts { display: grid; grid-template-columns: repeat(2, auto); gap: 0.1rem; justify-items: center; }
.icon {
  width: 2.75rem; height: 2.75rem;
  display: grid; place-items: center;
  border: 0; background: transparent; border-radius: 50%;
  cursor: pointer; color: var(--muted);
}
.icon:hover { background: var(--soft); color: var(--fg); }
.icon svg { width: 1.35rem; height: 1.35rem; display: block; }
.icon.speaking { background: var(--soft); color: var(--badge); }
.icon.learn[aria-pressed="true"] { background: var(--good-bg); color: var(--good); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: min(92vw, 26rem);
  background: var(--fg);
  color: var(--bg);
  padding: 0.6rem 1rem;
  border-radius: 10px;
  font-size: 0.9rem;
  z-index: 10;
}
.foot { color: var(--muted); font-size: 0.82rem; margin: 0; }
@media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }

/* Narrow screens: the left panel becomes a strip across the top. */
@media (max-width: 46rem) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0.75rem; }
  .side { position: sticky; top: 0; z-index: 5; max-height: none; flex-direction: row; align-items: center; gap: 0; border-radius: 12px; }
  .badge { display: none; }
  .prog { display: none; }
  .menu { display: flex; gap: 0.25rem; overflow-x: auto; overflow-y: hidden; padding: 0.4rem; }
  .menu li { flex: none; }
  .menu button { width: auto; white-space: nowrap; }
  .menu .ct { display: none; }
  .mobile-head { display: block; }
}
.mobile-head { display: none; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
</style>
</head>
<body>
<div class="layout" id="app">
  <aside class="side">
    <div class="badge">
      <h1><span class="hello">Hello</span><span class="who">everyone<span class="sr">.</span></span></h1>
    </div>
    <ul class="menu" id="menu" aria-label="Languages"></ul>
    <div class="prog">
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
      <span id="progText" aria-live="polite">0 of 0 learned</span>
    </div>
  </aside>

  <div class="pane">
    <p class="mobile-head">Hello, everyone</p>
    <div class="seg" role="group" aria-label="Practice mode">
      <button type="button" data-mode="study" aria-pressed="true">Study</button>
      <button type="button" data-mode="script" aria-pressed="false">See script</button>
      <button type="button" data-mode="english" aria-pressed="false">See English</button>
    </div>
    <div class="tools">
      <p class="caption" id="caption"></p>
      <button type="button" class="pill" id="reset">Clear progress</button>
    </div>

    <main id="langs"></main>

    <p class="foot">Respellings are English approximations. The speaker button plays a recording saved inside this file, so it works offline. Tick the circle on a greeting once you can say it without help.</p>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

        '<div class="mean f-mean' + hideMean + '"><span>' + esc(it.m) + '</span><span class="tag">' + esc(it.g) + '</span></div>' +
        '<div class="hint">Tap to reveal</div>' +
      '</div>' +
      '<div class="acts">' +
        (AUDIO[key] ? '<button type="button" class="icon speak" data-act="speak" data-key="' + key + '" aria-label="Listen to ' + esc(l.name) + ' greeting">' + ICON_SPEAK + '</button>' : '<span></span>') +
        '<button type="button" class="icon learn" data-act="learn" data-key="' + key + '" aria-pressed="' + learned + '" aria-label="Mark as learned">' + ICON_CHECK + '</button>' +
      '</div>' +
    '</li>';
  }

  function render() {
    var l = currentLang();
    var rows = l.items.map(function (_, i) { return rowHtml(l, i); }).join("");
    var main = document.getElementById("langs");
    main.innerHTML =
      '<section class="lang" id="' + l.id + '" aria-labelledby="h-' + l.id + '">' +
        '<div class="lang-head">' +
          '<div class="lang-title"><h2 id="h-' + l.id + '">' + esc(l.name) + '</h2><span class="own" lang="' + esc(l.lang) + '">' + esc(l.own) + '</span><span class="count" data-count="' + l.id + '"></span></div>' +
          '<p class="where">' + esc(l.where) + '</p>' +
          '<p class="tip">' + esc(l.tip) + '</p>' +
        '</div>' +
        '<ul class="rows">' + rows + '</ul>' +
      '</section>';
    main.className = (state.mode !== "study" ? "practice " : "") + "mode-" + state.mode;
    document.getElementById("caption").textContent = CAPTIONS[state.mode];
    Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === state.mode));
    });
    renderMenu();
    updateProgress();
  }

  function renderMenu() {
    document.getElementById("menu").innerHTML = LANGS.map(function (l) {
      var d = l.items.filter(function (_, i) { return state.learned[keyOf(l, i)]; }).length;
      var all = d === l.items.length;
      return '<li><button type="button" data-lang="' + l.id + '" class="' + (all ? "done" : "") + '" aria-current="' + (l.id === state.lang) + '">' +
        '<span class="nm">' + esc(l.name) + '</span><span class="ct">' + d + ' / ' + l.items.length + '</span></button></li>';
    }).join("");
  }

  function updateProgress() {
    var total = 0, done = 0;
    LANGS.forEach(function (l) {
      var d = 0;
      l.items.forEach(function (_, i) { total++; if (state.learned[keyOf(l, i)]) { d++; done++; } });
      var el = document.querySelector('[data-count="' + l.id + '"]');
      if (el) el.textContent = d + " / " + l.items.length;
    });
    document.getElementById("meter").style.width = (total ? (done / total) * 100 : 0) + "%";
    document.getElementById("progText").textContent = done + " of " + total + " learned";
  }

  /* Audio */
  var toastTimer, player = null, playingBtn = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function stopPlayer() {
    if (player) { player.pause(); player = null; }
    if (playingBtn) { playingBtn.classList.remove("speaking"); playingBtn = null; }
  }
  function speak(key, btn) {
    var data = AUDIO[key];
    stopPlayer();
    if (!data) { toast("No recording saved for this greeting."); return; }
    var a = new Audio("data:audio/mpeg;base64," + data);
    player = a; playingBtn = btn;
    btn.classList.add("speaking");
    a.onended = function () { if (player === a) stopPlayer(); };
    a.onerror = function () { if (player === a) stopPlayer(); toast("Audio can't play in this browser."); };
    var p = a.play();
    if (p && p.catch) p.catch(function () { if (player === a) stopPlayer(); toast("Audio can't play in this browser."); });
  }

  /* Events */
  function toggleOpen(row) {
    var key = row.getAttribute("data-key");
    state.open[key] = !state.open[key];
    render();
    var again = document.querySelector('.row[data-key="' + key + '"] .content');
    if (again) again.focus({ preventScroll: true });
  }

  document.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (act) {
      var key = act.getAttribute("data-key");
      if (act.getAttribute("data-act") === "speak") { speak(key, act); }
      else {
        state.learned[key] = !state.learned[key];
        if (!state.learned[key]) delete state.learned[key];
        act.setAttribute("aria-pressed", String(!!state.learned[key]));
        persist(); updateProgress(); renderMenu();
      }
      return;
    }
    var pick = e.target.closest("[data-lang]");
    if (pick) {
      stopPlayer();
      state.lang = pick.getAttribute("data-lang"); state.open = {};
      try { history.replaceState(null, "", "#" + state.lang); } catch (err) {}
      render();
      return;
    }
    var seg = e.target.closest(".seg button");
    if (seg) { state.mode = seg.getAttribute("data-mode"); state.open = {}; render(); return; }
    var content = e.target.closest(".practice .content");
    if (content) { toggleOpen(content.closest(".row")); }
  });

  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".practice .content")) {
      e.preventDefault();
      toggleOpen(e.target.closest(".row"));
    }
  });

  var resetBtn = document.getElementById("reset"), resetTimer, armed = false;
  resetBtn.addEventListener("click", function () {
    if (!armed) {
      armed = true; resetBtn.textContent = "Tap again to clear";
      resetTimer = setTimeout(function () { armed = false; resetBtn.textContent = "Clear progress"; }, 3000);
      return;
    }
    clearTimeout(resetTimer); armed = false; resetBtn.textContent = "Clear progress";
    state.learned = {}; persist(); render();
    toast("Progress cleared.");
  });

  render();
})();
</script>
</body>
</html>
