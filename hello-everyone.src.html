<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, Everyone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a left panel with the language menu, and the selected language's greetings on the right. */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --fg: #121A24;
  --muted: #566372;
  --line: #D8DFE6;
  --soft: #E3E8EE;
  --badge: #D62839;
  --badge-fg: #FFFFFF;
  --good: #1B7F55;
  --good-bg: #DDF1E7;
  --good-fg: #FFFFFF;
  --open: #0B7FC7;
  --open-fg: #FFFFFF;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-script: "Noto Sans", "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "PingFang SC", "Malgun Gothic", "Noto Sans Tamil", "Noto Sans Devanagari", "Noto Sans Malayalam", "Noto Sans Thai", "Noto Sans Hebrew", "Noto Sans Bengali", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151C;
    --surface: #18212B;
    --fg: #E8EDF2;
    --muted: #93A1B0;
    --line: #2B3846;
    --soft: #223040;
    --badge: #E5455A;
    --badge-fg: #FFFFFF;
    --good: #4CC38A;
    --good-bg: #17382A;
    --good-fg: #08150F;
    --open: #4DB3F0;
    --open-fg: #07151F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151C;
  --surface: #18212B;
  --fg: #E8EDF2;
  --muted: #93A1B0;
  --line: #2B3846;
  --soft: #223040;
  --badge: #E5455A;
  --badge-fg: #FFFFFF;
  --good: #4CC38A;
  --good-bg: #17382A;
    --good-fg: #08150F;
    --open: #4DB3F0;
    --open-fg: #07151F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.45;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--badge); outline-offset: 2px; border-radius: 6px; }

.layout {
  max-width: 62rem;
  margin-inline: auto;
  padding: 1.25rem 1rem 3rem;
  display: grid;
  grid-template-columns: 15.5rem minmax(0, 1fr);
  gap: 1.25rem;
  align-items: start;
}

/* Left panel */
.side {
  position: sticky;
  top: 1rem;
  max-height: calc(100vh - 2rem);
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.badge h1 { margin: 0; display: flex; flex-direction: column; }
.badge .hello {
  position: relative;
  background: var(--badge);
  color: var(--badge-fg);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  text-align: center;
  padding: 1rem 1rem 0.45rem;
}
.badge .hello::before {
  content: "";
  position: absolute;
  top: 0.35rem;
  left: 50%;
  width: 2.4rem;
  height: 0.35rem;
  margin-left: -1.2rem;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.28);
}
.badge .who {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.1rem;
  line-height: 1.05;
  letter-spacing: -0.02em;
  padding: 0.7rem 1rem 0;
}
.menu { list-style: none; margin: 0; padding: 0 0.5rem; overflow-y: auto; flex: 1; scrollbar-width: thin; }
.menu button {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  text-align: left;
  border: 0;
  background: transparent;
  border-radius: 9px;
  padding: 0.6rem 0.7rem;
  min-height: 2.75rem;
  cursor: pointer;
  font-weight: 500;
}
.menu button:hover { background: var(--soft); }
.menu button[aria-current="true"] { background: var(--badge); color: var(--badge-fg); }
.menu .nm { flex: 1; min-width: 0; }
.menu .ct { font-size: 0.78rem; opacity: 0.75; font-variant-numeric: tabular-nums; }
.prog { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.meter span { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.25s ease; }

/* Right panel */
.pane { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--soft);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
}
.seg button {
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 0.55rem 0.4rem;
  font-weight: 600;
  font-size: 0.92rem;
  cursor: pointer;
  min-height: 2.75rem;
}
.seg button[aria-pressed="true"] { background: var(--badge); color: var(--badge-fg); }
.seg.who { grid-template-columns: repeat(2, 1fr); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.caption { flex: 1 1 16rem; min-width: 0; margin: 0; color: var(--muted); font-size: 0.92rem; }
.pill {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 0.4rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  min-height: 2.25rem;
}

.lang { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.lang-head { padding: 1rem 1rem 0.75rem; display: flex; flex-direction: column; gap: 0.2rem; }
.lang-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.7rem; }
.lang-title h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em; }
.lang-title .own { font-family: var(--font-script); color: var(--muted); font-size: 1rem; }
.lang-title .count { margin-left: auto; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.where { margin: 0; font-size: 0.85rem; color: var(--muted); }
.tip { margin: 0.35rem 0 0; font-size: 0.88rem; background: var(--soft); border-radius: 8px; padding: 0.5rem 0.7rem; }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; padding: 0.85rem 0.6rem 0.85rem 1rem; border-top: 1px solid var(--line); align-items: start; }
.content { min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; border-radius: 8px; }
.native { font-family: var(--font-script); font-weight: 600; font-size: clamp(1.45rem, 5vw, 1.9rem); line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
.roman { font-weight: 600; font-size: 1rem; }
.say { color: var(--muted); font-size: 0.95rem; }
.say .lab { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 0.4rem; }
.mean { font-size: 0.92rem; display: flex; flex-wrap: wrap; gap: 0.3rem 0.5rem; align-items: center; }
.tag { background: var(--soft); color: var(--muted); border-radius: 99px; padding: 0.05rem 0.6rem; font-size: 0.78rem; font-weight: 500; }


.acts { display: grid; gap: 0.1rem; justify-items: center; }
.icon {
  width: 2.75rem; height: 2.75rem;
  display: grid; place-items: center;
  border: 0; background: transparent; border-radius: 50%;
  cursor: pointer; color: var(--muted);
}
.icon:hover { background: var(--soft); color: var(--fg); }
.icon svg { width: 1.35rem; height: 1.35rem; display: block; }
.icon.speaking { background: var(--soft); color: var(--badge); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: min(92vw, 26rem);
  background: var(--fg);
  color: var(--bg);
  padding: 0.6rem 1rem;
  border-radius: 10px;
  font-size: 0.9rem;
  z-index: 10;
}
.foot { color: var(--muted); font-size: 0.82rem; margin: 0; }
@media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }

/* Study button and the full-screen study view */
.study-btn {
  margin: 0 0.75rem;
  min-height: 3rem;
  border: 0;
  border-radius: 10px;
  background: var(--good);
  color: var(--good-fg);
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
}
.study-btn:hover { filter: brightness(1.08); }
.study { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; }
.study[hidden] { display: none; }
.study-inner { max-width: 40rem; margin-inline: auto; padding: 1rem 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
#studyBody { display: flex; flex-direction: column; gap: 1rem; }
.study:focus { outline: none; }
.study-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; color: var(--muted); font-size: 0.9rem; }
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
.flash-top { display: flex; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.4rem; }
.flash-lang { font-family: var(--font-display); font-weight: 800; color: var(--fg); font-size: 1.05rem; }
.flash-lang .own { font-family: var(--font-script); font-weight: 400; color: var(--muted); font-size: 0.9rem; }
.flash .native { font-size: clamp(1.8rem, 7vw, 2.6rem); }
.flash-audio { margin-top: 0.4rem; }
.flash.result { text-align: center; align-items: center; }
.flash.result h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.flash.result p { margin: 0; }
.big-score { font-family: var(--font-display); font-weight: 800; font-size: 3.5rem; line-height: 1.1; }
.muted { color: var(--muted); font-size: 0.9rem; }
.results { list-style: none; margin: 0.5rem 0; padding: 0; width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
.results li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.4rem 0; border-top: 1px solid var(--line); }
.study-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.study-actions.one { grid-template-columns: 1fr; }
.big { min-height: 3.25rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 1.05rem; cursor: pointer; }
.big.ok { background: var(--good); border-color: var(--good); color: var(--good-fg); }
.big.open { background: var(--open); border-color: var(--open); color: var(--open-fg); }
.big:disabled { opacity: 0.4; cursor: default; }
.study-actions.three { grid-template-columns: repeat(3, 1fr); }
.flash .prompt { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.15; }
.flash .answer { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.6rem; padding-top: 0.9rem; border-top: 1px solid var(--line); }
.big.bad { background: var(--badge); border-color: var(--badge); color: var(--badge-fg); }

/* Narrow screens: the left panel becomes a strip across the top. */
@media (max-width: 46rem) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0.75rem; }
  .side { position: sticky; top: 0; z-index: 5; max-height: none; flex-direction: row; align-items: center; gap: 0; border-radius: 12px; }
  .badge { display: none; }
  .study-btn { flex: none; margin: 0.4rem 0 0.4rem 0.4rem; padding: 0 1.1rem; min-height: 2.75rem; }
  .prog { display: none; }
  .menu { display: flex; gap: 0.25rem; overflow-x: auto; overflow-y: hidden; padding: 0.4rem; }
  .menu li { flex: none; }
  .menu button { width: auto; white-space: nowrap; }
  .menu .ct { display: none; }
  .mobile-head { display: block; }
}
.mobile-head { display: none; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
</style>
</head>
<body>
<div class="layout" id="app">
  <aside class="side">
    <div class="badge">
      <h1><span class="hello">Hello</span><span class="who">everyone<span class="sr">.</span></span></h1>
    </div>
    <button type="button" class="study-btn" id="studyBtn">Study</button>
    <ul class="menu" id="menu" aria-label="Languages"></ul>
    <div class="prog">
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
      <span id="progText" aria-live="polite"></span>
    </div>
  </aside>

  <div class="pane">
    <p class="mobile-head">Hello, everyone</p>
    <div class="seg who" role="group" aria-label="Greet">
      <button type="button" data-who="all" aria-pressed="true">Everyone</button>
      <button type="button" data-who="one" aria-pressed="false">One person</button>
    </div>
    <div class="tools">
      <p class="caption">Read each greeting, listen to it, and say it out loud.</p>
      <button type="button" class="pill" id="reset">Reset scores</button>
    </div>

    <main id="langs"></main>

    <p class="foot">Respellings are English approximations. The speaker button plays a recording saved inside this file, so it works offline. Press Study to practise one group of languages at a time.</p>
  </div>
</div>
<div class="study" id="study" role="dialog" aria-modal="true" aria-label="Study" tabindex="-1" hidden>
  <div class="study-inner">
    <div class="study-top"><span id="studyCrumb"></span><button type="button" class="pill" id="studyClose">Close</button></div>
    <div class="meter" aria-hidden="true"><span id="studyMeter"></span></div>
    <div id="studyBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  /*LANGS*/
  var LANGS = [];
  /*END LANGS*/

  /*AUDIO*/
  var AUDIO = {};
  /*END AUDIO*/

  var OLD_STORE = "hello-everyone-learned-v2";
  var STORE = "hello-everyone-study-v1";
  var GROUPS = 5;

  var state = { who: "all", lang: LANGS[0].id };

  var fromHash = location.hash.slice(1);
  if (LANGS.some(function (l) { return l.id === fromHash; })) state.lang = fromHash;

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function langById(id) { return LANGS.filter(function (l) { return l.id === id; })[0]; }
  function currentLang() { return langById(state.lang); }

  // Every greeting has a version for everyone and one for a single person ("p"), keyed id:i and id:ip.
  // An item with no "p" version (a single phrase that suits both) uses the same key and text in both views.
  function keyOf(l, i) { return l.id + ":" + i + (state.who === "one" && l.items[i].p ? "p" : ""); }
  function shown(l, i) { return state.who === "one" && l.items[i].p ? l.items[i].p : l.items[i]; }
  // Every distinct greeting in a language, for the study test.
  function greetingsOf(l) {
    var out = [];
    l.items.forEach(function (it, i) {
      out.push({ it: it, key: l.id + ":" + i });
      if (it.p) out.push({ it: it.p, key: l.id + ":" + i + "p" });
    });
    return out;
  }

  var ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  /* Study progress, saved in this browser's local storage:
     a set is GROUPS groups of languages; scores are running ok / not-ok counts per language. */
  var store = loadStore();

  function blankStore() { return { v: 1, setNo: 0, setsDone: 0, groups: [], current: null, scores: {} }; }
  function newSet(s, advance) {
    var ids = shuffle(LANGS.map(function (l) { return l.id; }));
    s.groups = [];
    for (var g = 0; g < GROUPS; g++) s.groups.push({ langs: [], done: [] });
    ids.forEach(function (id, i) { s.groups[i % GROUPS].langs.push(id); });
    if (advance || !s.setNo) s.setNo += 1;
    s.current = null;
  }
  function groupFinished(g) { return g.done.length >= g.langs.length; }
  function groupsDone(s) { return s.groups.filter(groupFinished).length; }
  function setIsValid(s) {
    if (!s.groups || s.groups.length !== GROUPS) return false;
    var seen = {}, n = 0;
    s.groups.forEach(function (g) { g.langs.forEach(function (id) { seen[id] = (seen[id] || 0) + 1; n++; }); });
    return n === LANGS.length && LANGS.every(function (l) { return seen[l.id] === 1; });
  }
  function loadStore() {
    var s = null;
    try { localStorage.removeItem(OLD_STORE); } catch (e) {}
    try { s = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    if (!s || s.v !== 1 || !s.scores) s = blankStore();
    // A new set is made if there is none, if the language list changed, or if the last one was finished.
    if (!setIsValid(s)) newSet(s, false);
    else if (groupsDone(s) === GROUPS) newSet(s, true);
    return s;
  }
  function saveStore() { try { localStorage.setItem(STORE, JSON.stringify(store)); } catch (e) {} }

  function scoreOf(id) {
    var s = store.scores[id], total = s ? s.ok + s.notOk : 0;
    return { ok: s ? s.ok : 0, total: total, pct: total ? Math.round(s.ok / total * 100) : null };
  }

  function rowHtml(l, i) {
    var it = shown(l, i), key = keyOf(l, i);
    var dir = l.rtl ? ' dir="rtl"' : "";
    return '<li class="row" data-key="' + key + '">' +
      '<div class="content">' +
        '<div class="native" lang="' + esc(l.lang) + '"' + dir + '>' + esc(it.t) + '</div>' +
        (it.r ? '<div class="roman">' + esc(it.r) + '</div>' : '') +
        '<div class="say"><span class="lab">Sounds like</span>' + esc(it.s) + '</div>' +
        '<div class="mean"><span>' + esc(it.m) + '</span><span class="tag">' + esc(it.g) + '</span></div>' +
      '</div>' +
      '<div class="acts">' +
        (AUDIO[key] ? '<button type="button" class="icon speak" data-act="speak" data-key="' + key + '" aria-label="Listen to ' + esc(l.name) + ' greeting">' + ICON_SPEAK + '</button>' : '') +
      '</div>' +
    '</li>';
  }

  function countText(id) {
    var sc = scoreOf(id);
    return sc.total ? "Score " + sc.pct + "% (" + sc.ok + " of " + sc.total + " OK)" : "Not studied yet";
  }

  function render() {
    var l = currentLang();
    var rows = l.items.map(function (_, i) { return rowHtml(l, i); }).join("");
    document.getElementById("langs").innerHTML =
      '<section class="lang" id="' + l.id + '" aria-labelledby="h-' + l.id + '">' +
        '<div class="lang-head">' +
          '<div class="lang-title"><h2 id="h-' + l.id + '">' + esc(l.name) + '</h2><span class="own" lang="' + esc(l.lang) + '">' + esc(l.own) + '</span><span class="count">' + esc(countText(l.id)) + '</span></div>' +
          '<p class="where">' + esc(l.where) + '</p>' +
          '<p class="tip">' + esc(l.tip) + '</p>' +
        '</div>' +
        '<ul class="rows">' + rows + '</ul>' +
      '</section>';
    Array.prototype.forEach.call(document.querySelectorAll(".seg button[data-who]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-who") === state.who));
    });
    renderMenu();
    updateProgress();
  }

  function renderMenu() {
    document.getElementById("menu").innerHTML = LANGS.map(function (l) {
      var sc = scoreOf(l.id);
      return '<li><button type="button" data-lang="' + l.id + '" aria-current="' + (l.id === state.lang) + '">' +
        '<span class="nm">' + esc(l.name) + '</span><span class="ct" title="Share of greetings marked OK">' + (sc.total ? sc.pct + "%" : "–") + '</span></button></li>';
    }).join("");
  }

  function updateProgress() {
    var done = groupsDone(store);
    document.getElementById("meter").style.width = (done / GROUPS * 100) + "%";
    document.getElementById("progText").textContent = "Set " + store.setNo + ": " + done + " of " + GROUPS + " groups studied";
  }

  /* Audio */
  var toastTimer, player = null, playingBtn = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function stopPlayer() {
    if (player) { player.pause(); player = null; }
    if (playingBtn) { playingBtn.classList.remove("speaking"); playingBtn = null; }
  }
  function speak(key, btn) {
    var data = AUDIO[key];
    stopPlayer();
    if (!data) { toast("No recording saved for this greeting."); return; }
    var a = new Audio("data:audio/mpeg;base64," + data);
    player = a; playingBtn = btn;
    btn.classList.add("speaking");
    a.onended = function () { if (player === a) stopPlayer(); };
    a.onerror = function () { if (player === a) stopPlayer(); toast("Audio can't play in this browser."); };
    var p = a.play();
    if (p && p.catch) p.catch(function () { if (player !== a) return; stopPlayer(); toast("Audio can't play in this browser."); });
  }

  /* Study: full screen, one group of languages at a time, one greeting at a time. */
  var session = null;
  var studyEl = document.getElementById("study"), studyBody = document.getElementById("studyBody");

  function openStudy() {
    var g = store.current;
    if (g == null || groupFinished(store.groups[g])) {
      var open = [];
      store.groups.forEach(function (grp, i) { if (!groupFinished(grp)) open.push(i); });
      g = open[Math.floor(Math.random() * open.length)];
      store.current = g; saveStore();
    }
    var grp = store.groups[g];
    session = {
      g: g, total: grp.langs.length, results: [], cur: null,
      queue: shuffle(grp.langs.filter(function (id) { return grp.done.indexOf(id) < 0; }))
    };
    studyEl.hidden = false;
    document.body.style.overflow = "hidden";
    nextCard();
  }

  function closeStudy() {
    stopPlayer();
    studyEl.hidden = true;
    document.body.style.overflow = "";
    session = null;
    render();
    document.getElementById("studyBtn").focus();
  }

  function setStudy(crumb, fraction, html) {
    document.getElementById("studyCrumb").textContent = crumb;
    document.getElementById("studyMeter").style.width = Math.round(fraction * 100) + "%";
    studyBody.innerHTML = html;
    studyEl.focus({ preventScroll: true });
    studyEl.scrollTop = 0;
  }

  function crumbText() {
    var done = session.total - session.queue.length;
    return "Set " + store.setNo + " · Group " + (session.g + 1) + " · Language " + Math.min(done + 1, session.total) + " of " + session.total;
  }

  function nextCard() {
    if (!session.queue.length) { showGroupDone(); return; }
    var l = langById(session.queue[0]);
    session.cur = { id: l.id, list: shuffle(greetingsOf(l)), i: 0, ok: 0, opened: false };
    showGreeting();
  }

  // The test: show the English first, the learner says the greeting, presses Open to check it,
  // then rates themselves OK or Not OK. Rating is only possible once the answer is open.
  function showGreeting() {
    var c = session.cur, l = langById(c.id), gr = c.list[c.i], it = gr.it;
    var dir = l.rtl ? ' dir="rtl"' : "";
    var done = session.total - session.queue.length;
    var answerHtml = c.opened
      ? '<div class="answer">' +
          '<div class="native" lang="' + esc(l.lang) + '"' + dir + '>' + esc(it.t) + '</div>' +
          (it.r ? '<div class="roman">' + esc(it.r) + '</div>' : '') +
          '<div class="say"><span class="lab">Sounds like</span>' + esc(it.s) + '</div>' +
          (AUDIO[gr.key] ? '<div class="flash-audio"><button type="button" class="icon speak" data-act="speak" data-key="' + gr.key + '" aria-label="Listen">' + ICON_SPEAK + '</button></div>' : '') +
        '</div>'
      : "";
    setStudy(crumbText(), (done + c.i / c.list.length) / session.total,
      '<div class="flash">' +
        '<div class="flash-top"><span class="flash-lang">' + esc(l.name) + ' <span class="own" lang="' + esc(l.lang) + '">' + esc(l.own) + '</span></span><span class="flash-n">Greeting ' + (c.i + 1) + ' of ' + c.list.length + '</span></div>' +
        '<div class="prompt">' + esc(it.m) + '</div>' +
        '<div class="mean"><span class="tag">' + esc(it.g) + '</span></div>' +
        answerHtml +
      '</div>' +
      '<div class="study-actions three">' +
        '<button type="button" class="big open" data-s="open"' + (c.opened ? " disabled" : "") + '>Open</button>' +
        '<button type="button" class="big bad" data-s="notok"' + (c.opened ? "" : " disabled") + '>Not OK</button>' +
        '<button type="button" class="big ok" data-s="ok"' + (c.opened ? "" : " disabled") + '>OK</button>' +
      '</div>');
  }

  function answer(ok) {
    stopPlayer();
    var c = session.cur;
    if (!c.opened) return;
    if (ok) c.ok++;
    c.i++;
    c.opened = false;
    if (c.i < c.list.length) showGreeting(); else finishCard();
  }

  function finishCard() {
    var c = session.cur, l = langById(c.id), n = c.list.length, pct = Math.round(c.ok / n * 100);
    var s = store.scores[c.id] || (store.scores[c.id] = { ok: 0, notOk: 0, last: 0, attempts: 0 });
    s.ok += c.ok; s.notOk += n - c.ok; s.last = pct; s.attempts++;
    store.groups[session.g].done.push(c.id);
    saveStore();
    session.queue.shift();
    session.results.push({ name: l.name, ok: c.ok, n: n, pct: pct });
    var last = !session.queue.length;
    var done = session.total - session.queue.length;
    setStudy(crumbText(), done / session.total,
      '<div class="flash result">' +
        '<h2>' + esc(l.name) + '</h2>' +
        '<p class="big-score">' + pct + '%</p>' +
        '<p>' + c.ok + ' of ' + n + ' greetings OK</p>' +
        '<p class="muted">Overall for ' + esc(l.name) + ': ' + esc(countText(l.id).replace("Score ", "")) + '</p>' +
      '</div>' +
      '<div class="study-actions one"><button type="button" class="big ok" data-s="next">' + (last ? "Finish group" : "Next language") + '</button></div>');
  }

  function showGroupDone() {
    var setNo = store.setNo, finishedSet = groupsDone(store) === GROUPS, doneCount = groupsDone(store);
    if (finishedSet) { store.setsDone++; newSet(store, true); }
    store.current = null;
    saveStore();
    var rows = session.results.map(function (r) {
      return '<li><span>' + esc(r.name) + '</span><span>' + r.ok + ' / ' + r.n + ' · ' + r.pct + '%</span></li>';
    }).join("");
    var msg = finishedSet
      ? "Set " + setNo + " is complete. Set " + store.setNo + " is ready, with new random groups."
      : "Set " + setNo + ": " + doneCount + " of " + GROUPS + " groups studied.";
    setStudy("Set " + setNo + " · Group " + (session.g + 1) + " finished", 1,
      '<div class="flash result">' +
        '<h2>' + (finishedSet ? "Set complete" : "Group finished") + '</h2>' +
        (rows ? '<ul class="results">' + rows + '</ul>' : '') +
        '<p>' + esc(msg) + '</p>' +
      '</div>' +
      '<div class="study-actions">' +
        '<button type="button" class="big" data-s="close">Close</button>' +
        '<button type="button" class="big ok" data-s="again">Study next group</button>' +
      '</div>');
    renderMenu(); updateProgress();
  }

  /* Events */
  document.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (act) { speak(act.getAttribute("data-key"), act); return; }
    var s = e.target.closest("[data-s]");
    if (s) {
      var what = s.getAttribute("data-s");
      if (what === "open") { session.cur.opened = true; showGreeting(); }
      else if (what === "ok") answer(true);
      else if (what === "notok") answer(false);
      else if (what === "next") nextCard();
      else if (what === "again") openStudy();
      else if (what === "close") closeStudy();
      return;
    }
    if (e.target.closest("#studyBtn")) { openStudy(); return; }
    if (e.target.closest("#studyClose")) { closeStudy(); return; }
    var pick = e.target.closest("[data-lang]");
    if (pick) {
      stopPlayer();
      state.lang = pick.getAttribute("data-lang");
      try { history.replaceState(null, "", "#" + state.lang); } catch (err) {}
      render();
      return;
    }
    var who = e.target.closest(".seg button[data-who]");
    if (who) { stopPlayer(); state.who = who.getAttribute("data-who"); render(); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !studyEl.hidden) closeStudy();
  });

  var resetBtn = document.getElementById("reset"), resetTimer, armed = false;
  resetBtn.addEventListener("click", function () {
    if (!armed) {
      armed = true; resetBtn.textContent = "Tap again to reset";
      resetTimer = setTimeout(function () { armed = false; resetBtn.textContent = "Reset scores"; }, 3000);
      return;
    }
    clearTimeout(resetTimer); armed = false; resetBtn.textContent = "Reset scores";
    store = blankStore(); newSet(store, false); saveStore(); render();
    toast("Scores reset.");
  });

  saveStore();
  render();
})();
</script>
</body>
</html>
